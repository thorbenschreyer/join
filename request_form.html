<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <title>Join Kanban</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/login.css" />
    <link rel="stylesheet" href="styles/login_resp.css" />
    <link rel="stylesheet" href="./styles/contact_dialog.css" />
    <link rel="stylesheet" href="styles/request.css" />
    <link rel="stylesheet" href="styles/request_mobile.css" />
  </head>
  <body onload="(getUserData()),  succsesDialog.showModal()">
    <img
      class="main-logo-request-form-page"
      src="./assets/icons/main_logo_dark.png"
      alt=""
    />

    <div class="form-card">
      <div class="form-content">
        <header class="form-header">
          <a href="./login.html"
            ><img
              class="form-header-img"
              src="./assets/icons/arrow-left-line.png"
              alt=""
          /></a>
          <h1 class="form-header-h1">Your Request</h1>
        </header>
        <hr class="form-header-hr" />

        <form
          onsubmit="sendRequest(event)"
          class="request-card-form"
          novalidate
        >
          <p class="request-form-input-handler">
            <input
              oninput="checkRequestValidity()"
              required
              id="request-name"
              placeholder="Name"
              class="add-contact-dialog-right-inputfield request-form"
              type="text"
            /><img
              class="request-form-img"
              src="./assets/icons/person.png"
              alt=""
            />
          </p>
          <p class="request-form-input-handler">
            <input
              oninput="checkRequestValidity()"
              required
              id="request-email"
              placeholder="Email"
              class="add-contact-dialog-right-inputfield request-form"
              type="email"
            /><img
              class="request-form-img"
              src="./assets/icons/mail.png"
              alt=""
            />
          </p>
          <p class="request-form-input-handler">
            <input
              oninput="checkRequestValidity()"
              required
              id="request-subject"
              placeholder="Subject"
              class="add-contact-dialog-right-inputfield request-form"
              type="text"
            />
          </p>
          <p class="request-form-input-handler">
            <textarea
              oninput="checkRequestValidity()"
              name=""
              id="request-text"
              class="add-contact-dialog-right-inputfield request-form height-request-form-text"
              placeholder="Your Request..."
            ></textarea>
          </p>

          <div class="request-error-container">
            <span id="request-error-text" class="request-error-text"></span>
          </div>
          <div class="request-form-button">
            <button
              disabled
              id="send-request-button"
              type="submit"
              class="add-contact-dialog-button-create request-form-btn"
            >
              Send request
            </button>
          </div>
        </form>
      </div>

      <footer class="dialog-footer">
        <a
          onclick="noLoginToShow()"
          id="privacy-policy-link"
          class="privacy-and-legal-links"
          href="index.html?page=privacy"
          >Privacy Policy</a
        >
        <a
          id="legal-notice-link"
          class="privacy-and-legal-links"
          href="index.html?page=legal"
          >Legal notice</a
        >
      </footer>
    </div>

    <dialog class="succses-request-dialog" id="succses-request-dialog">
      <div class="succses-dialog-content">
        <div class="succses-dialog-information">
          <p class="sned_sucsess_text">Your request has been sent successfully!</p>
          <img class="send_sucsess_img" src="./assets/icons/send_request_sucsess.png" alt="" />
        </div>

        <div class="choose-section">
          <div class="welcome-card-choose">
            <button
              class="request-button reduce-height"
              onclick="window.location.href = 'request_page.html'"
            >
              Create new request
            </button>
          </div>
          <div class="welcome-card-choose">
            <button
              class="member-button"
              onclick="window.location.href = 'login.html'"
            >
              Back to start
            </button>
          </div>
        </div>
      </div>
    </dialog>
  </body>
  <script src="scripts/login.js" defer></script>

  <script src="templates/templatefunctions/templatefunctions.js" defer></script>
  <script src="script.js" defer></script>
  <script src="scripts/request.js" defer></script>
</html>
