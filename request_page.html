<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./assets/icons/favicon.png" />
    <title>Join Kanban</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="styles/request.css" />
    <link rel="stylesheet" href="styles/request_mobile.css" />
    <link rel="stylesheet" href="styles/login.css" />
    <link rel="stylesheet" href="styles/login_resp.css" />
  </head>
  <body onload="(getUserData(), setRequestText())">
    <img
      class="main-logo-request-page"
      src="./assets/icons/main_logo_dark.png"
      alt=""
    />
    <div class="request-page">
      <div class="welcome-container-card">
        <header class="request-header">
          <a href="./index.html">
            <img
              class="request-header-img"
              src="./assets/icons/back.svg"
              alt=""
          /></a>
          <p id="request-color" class="number-of-requests-not-ok"><span><b id="number-of-requests">0</b> of <b>10</b> requests used today</p>
        </header>

        <h1 class="request-h1">Welcome</h1>

        <div id="how-to-car" class="how-to-card">       
          
          
          <div class="how-to-text">
            <div>
              <p class="request-error">
                The daily 10-request limit has been reached! 
              </p>
              <img class="request-img-mobile" src="./assets/icons/request_not_ok.svg" alt="" />
              <p class="request-text-no-request">
                Need more? No worries — you can still send requests, but our team will review them manually instead of using AI to create tickets.
              </p>
              <button class="request-button create-request-button  margin-top-32" onclick="window.location.href='request_form.html'">Create request <img class="create-request-img" src="./assets/icons/check_light.svg" alt="" /></button>
            </div>

            <img class="request-img" src="./assets/icons/request_not_ok.svg" alt="" />
          </div>


        </div>
      </div>

      <div class="dialog-footer">
        <a
          onclick="noLoginToShow()"
          id="privacy-policy-link"
          class="privacy-and-legal-links"
          href="index.html?page=privacy"
          >Privacy Policy</a
        >
        <a
          id="legal-notice-link"
          class="privacy-and-legal-links"
          href="index.html?page=legal"
          >Legal notice</a
        >
      </div>
    </div>
  </body>
  <script src="scripts/login.js" defer></script>
  <script src="scripts/request.js" defer></script>
  <script src="templates/templatefunctions/templatefunctions.js" defer></script>
  <script src="script.js" defer></script>
</html>
